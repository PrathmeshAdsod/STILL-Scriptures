steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'apps/api/Dockerfile', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/still/still-api:$COMMIT_SHA', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/still/still-api:$COMMIT_SHA']
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/still/still-api:$COMMIT_SHA'
substitutions:
  _REGION: us-central1
