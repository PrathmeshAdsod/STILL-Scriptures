steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'apps/api/Dockerfile', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/still/still-api:${_TAG}', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/still/still-api:${_TAG}']
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/still/still-api:${_TAG}'
substitutions:
  _REGION: us-central1
  _TAG: manual
