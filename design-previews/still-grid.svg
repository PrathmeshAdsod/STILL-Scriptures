<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
  <rect width="1440" height="960" fill="#F7F5EE"/>
  <g stroke="#C7D5F3" stroke-width="1" opacity=".85">
    <path d="M64 0V960M240 0V960M720 0V960M1200 0V960M1376 0V960"/>
    <path d="M0 102H1440M0 642H1440M0 818H1440"/>
  </g>
  <g fill="#0B1020" font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="63" font-size="25" font-weight="700" letter-spacing="5">STILL</text>
    <text x="948" y="59" font-size="13" letter-spacing=".4">How it works</text>
    <text x="1064" y="59" font-size="13" letter-spacing=".4">Why quiet</text>
    <rect x="1247" y="35" width="129" height="42" rx="3" fill="#155EEF"/>
    <text x="1275" y="61" fill="#F7F5EE" font-size="13" font-weight="700">Begin a story</text>
  </g>
  <g fill="#0B1020" text-anchor="middle">
    <text x="720" y="262" font-family="Georgia, serif" font-size="71" letter-spacing="-2">Meaning has its moment.</text>
    <text x="720" y="318" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#424B5B">Watch the story first. Reflect when you choose.</text>
    <rect x="593" y="371" width="254" height="54" rx="3" fill="#155EEF"/>
    <text x="720" y="405" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#F7F5EE" font-weight="700">Begin with a story  →</text>
    <text x="720" y="474" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#667187" letter-spacing="2.5">A SPOILER-SAFE REFLECTION LAYER</text>
  </g>
  <g fill="#0B1020" font-family="Arial, Helvetica, sans-serif">
    <text x="65" y="688" font-size="16" font-weight="700">Spoiler-safe</text>
    <text x="65" y="716" font-size="14" fill="#50596A">No future meaning leaks into</text>
    <text x="65" y="737" font-size="14" fill="#50596A">the story you are still watching.</text>
    <text x="479" y="688" font-size="16" font-weight="700">Deliberate</text>
    <text x="479" y="716" font-size="14" fill="#50596A">Reflection waits for your</text>
    <text x="479" y="737" font-size="14" fill="#50596A">intentional pause.</text>
    <text x="894" y="688" font-size="16" font-weight="700">Scripture-grounded</text>
    <text x="894" y="716" font-size="14" fill="#50596A">A passage enters only when it</text>
    <text x="894" y="737" font-size="14" fill="#50596A">truly belongs beside the moment.</text>
  </g>
  <g transform="translate(240 850)">
    <rect width="960" height="240" rx="7" fill="#101827" transform="translate(0 -42)"/>
    <rect x="27" y="-15" width="906" height="158" rx="3" fill="#202B3D"/>
    <circle cx="480" cy="63" r="30" fill="#155EEF"/>
    <path d="M471 48l23 15-23 15z" fill="#F7F5EE"/>
    <rect x="27" y="163" width="906" height="42" rx="3" fill="#F7F5EE"/>
    <text x="52" y="189" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0B1020">Reflections so far</text>
    <text x="878" y="189" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#155EEF">⌄</text>
  </g>
</svg>
