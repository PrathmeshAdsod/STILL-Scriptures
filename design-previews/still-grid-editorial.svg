<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9F8F4"/>
      <stop offset=".56" stop-color="#F1F4FA"/>
      <stop offset="1" stop-color="#EBF0FA"/>
    </linearGradient>
    <linearGradient id="blueWash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6DD4FF"/>
      <stop offset="1" stop-color="#2858ED"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#102653" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="1440" height="1120" fill="url(#wash)"/>
  <g fill="none" stroke="#D7E0F0" stroke-width="1">
    <path d="M72 0V1120M246 0V1120M720 0V1120M1194 0V1120M1368 0V1120"/>
    <path d="M0 88H1440M0 746H1440M0 982H1440"/>
  </g>
  <g stroke="#AFC0DE" stroke-width="1" fill="#F7F9FC">
    <circle cx="72" cy="88" r="3"/><circle cx="246" cy="88" r="3"/><circle cx="720" cy="88" r="3"/>
    <circle cx="1194" cy="88" r="3"/><circle cx="1368" cy="88" r="3"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#0B1428">
    <text x="72" y="49" font-size="15" font-weight="700" letter-spacing="5.5">STILL</text>
    <text x="674" y="50" font-size="12" letter-spacing=".5">Library</text>
    <text x="753" y="50" font-size="12" letter-spacing=".5">Reflect</text>
    <text x="832" y="50" font-size="12" letter-spacing=".5">About</text>
    <circle cx="1318" cy="43" r="13" fill="none" stroke="#0B1428"/>
    <circle cx="1318" cy="39" r="4" fill="none" stroke="#0B1428"/>
    <path d="M1310 51c2-6 14-6 16 0" fill="none" stroke="#0B1428"/>
    <text x="1350" y="48" font-size="11" letter-spacing="1.3">SIGN IN</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="139" fill="#50627E" font-size="10" letter-spacing="2.6">A QUIET SYSTEM FOR WATCHING WELL</text>
    <text x="72" y="174" fill="#0B1428" font-size="11" letter-spacing=".9">01 / 03</text>
    <line x1="72" y1="191" x2="172" y2="191" stroke="#83CDF3" stroke-width="3"/>
    <line x1="172" y1="191" x2="246" y2="191" stroke="#C6D5E8" stroke-width="3"/>
  </g>

  <g fill="#0B1428" text-anchor="middle">
    <text x="720" y="267" font-family="Georgia, 'Times New Roman', serif" font-size="68" letter-spacing="-2.3">Let the story land</text>
    <text x="720" y="342" font-family="Georgia, 'Times New Roman', serif" font-size="68" letter-spacing="-2.3">before it <tspan fill="#1A7FE8" font-style="italic">speaks back.</tspan></text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="720" y="399" fill="#3B4A63" font-size="17">STILL meets you at the moment a scene becomes meaningful—</text>
    <text x="720" y="425" fill="#3B4A63" font-size="17">without pulling you ahead of the story.</text>
  </g>

  <g transform="translate(583 470)" font-family="Arial, Helvetica, sans-serif">
    <rect width="274" height="54" rx="3" fill="#0D3EBD"/>
    <path d="M25 27h11m-5.5-5.5v11" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="51" y="33" fill="#FFFFFF" font-size="12" font-weight="700" letter-spacing="1.8">ADD A STORY</text>
    <path d="M237 22l7 5-7 5" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>
  <text x="720" y="552" text-anchor="middle" fill="#6A7790" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2.1">WATCH FIRST. REFLECT WHEN YOU ARE READY.</text>

  <g transform="translate(72 592)" font-family="Arial, Helvetica, sans-serif">
    <rect width="1296" height="116" rx="3" fill="#FCFCFA" stroke="#CBD7E9"/>
    <line x1="264" y1="0" x2="264" y2="116" stroke="#DCE4EF"/>
    <line x1="720" y1="0" x2="720" y2="116" stroke="#DCE4EF"/>
    <text x="28" y="29" fill="#5E7290" font-size="10" letter-spacing="2">YOUR STORY REMAINS YOURS</text>
    <text x="28" y="61" fill="#10192B" font-family="Georgia, serif" font-size="22">No emotional spoilers.</text>
    <text x="28" y="86" fill="#526079" font-size="12">Only a quiet marker when a moment is ready.</text>
    <text x="292" y="30" fill="#5E7290" font-size="10" letter-spacing="2">THE CURRENT</text>
    <line x1="292" y1="71" x2="677" y2="71" stroke="#C6D7E9" stroke-width="2"/>
    <line x1="292" y1="71" x2="499" y2="71" stroke="#36BFF0" stroke-width="3"/>
    <circle cx="499" cy="71" r="8" fill="#0B42C6"/>
    <circle cx="499" cy="71" r="3" fill="#FFFFFF"/>
    <text x="292" y="95" fill="#61718B" font-size="11">00:37 watched</text>
    <text x="626" y="95" fill="#0B42C6" font-size="11" text-anchor="end">one reflection waiting</text>
    <text x="749" y="29" fill="#5E7290" font-size="10" letter-spacing="2">THE PROMISE</text>
    <text x="749" y="61" fill="#10192B" font-family="Georgia, serif" font-size="21">Meaning, never premature.</text>
    <text x="749" y="86" fill="#526079" font-size="12">Your watched frontier is the boundary.</text>
  </g>

  <g transform="translate(72 807)">
    <text x="0" y="0" fill="#0D3EBD" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2.3">A DIFFERENT KIND OF VIDEO LIBRARY</text>
    <text x="0" y="49" fill="#0B1428" font-family="Georgia, 'Times New Roman', serif" font-size="38" letter-spacing="-1">Designed for the pause</text>
    <text x="0" y="91" fill="#0B1428" font-family="Georgia, 'Times New Roman', serif" font-size="38" letter-spacing="-1">after the scene.</text>
    <text x="0" y="129" fill="#53637C" font-family="Arial, Helvetica, sans-serif" font-size="14">STILL holds the context, the questions, and the right timing.</text>

    <g transform="translate(640 -35)" filter="url(#shadow)">
      <rect width="585" height="222" rx="9" fill="#091C45"/>
      <rect x="1" y="1" width="583" height="33" rx="9" fill="#102A60"/>
      <circle cx="21" cy="17" r="4" fill="#75D2F5"/>
      <circle cx="35" cy="17" r="4" fill="#6E8CE6"/>
      <circle cx="49" cy="17" r="4" fill="#3652A1"/>
      <text x="74" y="21" fill="#C7D8FF" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="1.1">THE QUIET ROOM / 00:37</text>
      <rect x="23" y="54" width="234" height="141" rx="4" fill="#DCE6F7"/>
      <rect x="33" y="64" width="214" height="121" rx="2" fill="#385B8C"/>
      <path d="M33 138C76 105 104 104 142 132s73 28 105-15v68H33Z" fill="#1B315A"/>
      <circle cx="104" cy="105" r="20" fill="#F2C7A7"/>
      <path d="M85 100c3-30 38-32 40 2v16H85Z" fill="#17223C"/>
      <path d="M84 143c10-27 45-27 58 0v39H84Z" fill="#E9A862"/>
      <circle cx="188" cy="115" r="16" fill="#E2B894"/>
      <path d="M171 109c3-23 31-23 34 1v10H171Z" fill="#1C2846"/>
      <path d="M168 149c10-25 38-24 49 0v36H168Z" fill="#7093D5"/>
      <rect x="281" y="54" width="276" height="141" rx="4" fill="#F4F6FB"/>
      <text x="305" y="82" fill="#6880A6" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="1.8">OBSERVED, NOT INTERPRETED</text>
      <text x="305" y="112" fill="#14223D" font-family="Georgia, serif" font-size="18" font-style="italic">“The room laughs, but he</text>
      <text x="305" y="137" fill="#14223D" font-family="Georgia, serif" font-size="18" font-style="italic">does not look amused.”</text>
      <line x1="305" y1="160" x2="497" y2="160" stroke="#CCE0FA" stroke-width="2"/>
      <circle cx="305" cy="178" r="5" fill="#3AC6F3"/>
      <text x="319" y="182" fill="#3377C8" font-family="Arial, Helvetica, sans-serif" font-size="11">Reflection held until watched</text>
    </g>
  </g>

  <g transform="translate(72 1036)" font-family="Arial, Helvetica, sans-serif" fill="#6A7790">
    <text x="0" y="0" font-size="10" letter-spacing="2.7">STILL / V1</text>
    <text x="0" y="29" font-size="11">A spoiler-safe reflection layer for video.</text>
    <text x="1120" y="0" font-size="10" letter-spacing="1.3">PRIVACY</text>
    <text x="1200" y="0" font-size="10" letter-spacing="1.3">TERMS</text>
  </g>
</svg>
